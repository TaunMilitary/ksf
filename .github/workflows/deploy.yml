name: Deploy to GitHub Pages (ksf)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "pages-verify"
  cancel-in-progress: true

jobs:
  verify-and-prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify GitHub Pages static bundle integrity
        run: |
          echo "Verifying Fatsa Sulh Hukuk Kesif Planlayici static bundle for GitHub Pages..."
          test -f index.html && echo "✓ index.html present"
          test -f standalone-bundle.js && echo "✓ standalone-bundle.js present"
          test -f standalone-bundle.css && echo "✓ standalone-bundle.css present"
          test -f .nojekyll && echo "✓ .nojekyll present"
          echo "All static assets verified for direct GitHub Pages branch deployment."
