<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fatsa Adliyesi Akıllı Keşif Planlayıcı</title>
    <meta name="description" content="Ordu ili Fatsa Adliyesi Sulh Hukuk Mahkemesi kalem personeli ve hakimler için konum, mesafe, güzergah optimizasyonu ve bulut senkronizasyonu destekli akıllı keşif planlama sistemi." />
    <meta property="og:title" content="Fatsa Adliyesi Akıllı Keşif Planlayıcı" />
    <meta property="og:description" content="Ordu ili Fatsa Adliyesi Sulh Hukuk Mahkemesi kalem personeli ve hakimler için konum, mesafe, güzergah optimizasyonu ve bulut senkronizasyonu destekli akıllı keşif planlama sistemi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script>
      // Ignore harmless Vite HMR WebSocket connection errors in sandbox iframe environment
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = String(reason || '');
        if (
          msg.includes('WebSocket') ||
          msg.includes('createWebSocketModuleRunnerTransport') ||
          (reason && reason.message && reason.message.includes('WebSocket')) ||
          (reason && reason.stack && reason.stack.includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        if (
          (event.message && event.message.includes('WebSocket')) ||
          (event.filename && event.filename.includes('@vite/client')) ||
          (event.error && event.error.stack && event.error.stack.includes('createWebSocketModuleRunnerTransport'))
        ) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-500/20 selection:text-emerald-900">
    <div id="root"></div>
    <script>
      // Bilgisayara indirildikten sonra (file://) veya GitHub Pages (github.io) kök dizininden doğrudan çalıştırıldığında:
      (function () {
        var isFileProtocol = window.location.protocol === 'file:';
        var isGitHubPages = /\.github\.io$/i.test(window.location.hostname);

        function loadStandaloneBundle() {
          if (window.__fatsaStandaloneLoaded) return;
          window.__fatsaStandaloneLoaded = true;

          var cssLink = document.createElement('link');
          cssLink.rel = 'stylesheet';
          cssLink.href = './standalone-bundle.css';
          document.head.appendChild(cssLink);

          var appScript = document.createElement('script');
          appScript.src = './standalone-bundle.js';
          document.body.appendChild(appScript);
        }

        if (isFileProtocol) {
          loadStandaloneBundle();
        } else {
          window.addEventListener('DOMContentLoaded', function () {
            var rawViteScript = document.querySelector('script[src*="/src/main.tsx"]');
            if (rawViteScript && isGitHubPages) {
              rawViteScript.removeAttribute('src');
              loadStandaloneBundle();
            }
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
